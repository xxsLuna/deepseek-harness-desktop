appId: com.github.xxsluna.deepseek-harness-desktop
productName: DeepSeek Harness
copyright: MIT — bundles DeepSeek Harness (c) DeepSeek AI

directories:
  output: out
  # build/ is the harness staging dir, so icons live in assets/
  buildResources: assets

# The asar holds only this shell's compiled main; the harness tree and the
# stock Node runtime ship beside it so native prebuilds and spawned binaries
# stay ordinary files on disk (no asar unpacking, no Electron ABI rebuilds).
# They are copied by the afterPack hook — the builder's file matcher
# hard-excludes node_modules paths, and the harness tree is one.
files:
  - dist/**
  - package.json
  - harness.json
asar: true
npmRebuild: false

# The tray reads its image from disk at runtime, so the assets ship unpacked
# beside the app rather than only feeding the icon generator.
extraResources:
  - from: assets
    to: assets
    filter: ['*.png']
extraMetadata:
  desktop:
    macUpdatesSigned: false
afterPack: scripts/after-pack.mjs

# Unsigned v1: both switches are single-line reversals once certificates exist.
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
  identity: null

# zip is omitted on Windows: NSIS + latest.yml is the updater feed there, and
# 7za exhausts hosted-runner memory zipping the ~700MB payload. The same 7za
# failure hits the NSIS differential package and its max-compression internal
# archive, so differential updates are off (updates download the full
# installer) and compression is store — trading installer size for a build
# that fits hosted-runner memory.
win:
  target: [nsis]
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false

compression: store

linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Luna <xxs.main@gmail.com>

protocols:
  - name: DeepSeek Harness
    schemes: [dsh-app]

publish:
  - provider: github
    owner: xxsLuna
    repo: deepseek-harness-desktop
    releaseType: draft
