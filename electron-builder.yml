appId: com.github.xxsluna.deepseek-harness-desktop
productName: DeepSeek Harness
copyright: MIT — bundles DeepSeek Harness (c) DeepSeek AI

# `productName` has a SPACE in it, and every artifact name below is spelled out
# without one for that reason. It is not cosmetic — the space silently broke
# auto-update on every platform and every release.
#
# Three parties disagree about what a space becomes:
#
#   electron-builder writes the file   `DeepSeek Harness Setup 0.1.1-….exe`
#   …and the URL-safe form into the yml `DeepSeek-Harness-Setup-0.1.1-….exe`
#   GitHub renames the uploaded asset   `DeepSeek.Harness.Setup.0.1.1-….exe`
#
# So `latest*.yml` named a file that does not exist and every download 404'd —
# the installer, the dmg, the zip and the AppImage alike. Only the `.deb`
# resolved, because its Debian-convention name is built from `${name}`, which
# has no space. It went unseen because until the electron-updater CJS interop
# fix (see src/updater.ts) no check ever reached the download at all: this is
# the next layer of the same "the app cannot update itself" bug.
#
# Spelling the names here makes all three agree, and the shapes are the same
# ones electron-builder's defaults produced, minus the space.
# `scripts/verify-feed.mjs` is what keeps them agreeing — it runs in the build
# and fails if any feed names a file the build did not produce.

directories:
  output: out
  # build/ is the harness staging dir, so icons live in assets/
  buildResources: assets

# The asar holds only this shell's compiled main; the harness tree ships beside
# it so native prebuilds and spawned binaries stay ordinary files on disk (no
# asar unpacking, no Electron ABI rebuilds). It is copied by the afterPack hook
# — the builder's file matcher hard-excludes node_modules paths, and the harness
# tree is one.
#
# No second Node runtime ships: the harness runs on this app's own Electron
# binary under ELECTRON_RUN_AS_NODE (src/sidecar.ts), which is 89MB the installer
# no longer carries. The ABI question that decision turns on is asserted in
# tests/contract/native-tools.spec.ts, not assumed.
files:
  - dist/**
  - package.json
  - harness.json
asar: true
npmRebuild: false

# Electron ships 55 Chromium locale packs (47MB) by default. The app's own UI
# is English and Korean, and the harness sends its own strings, so the rest are
# 45MB and 53 files of pure install cost. Chromium falls back to en-US for any
# locale not listed.
electronLanguages: [en-US, ko]

# The tray and the window icon are read from disk at runtime, so the assets
# ship unpacked beside the app rather than only feeding the icon generator.
extraResources:
  - from: assets
    to: assets
    filter: ['*.png', '*.ico']
extraMetadata:
  desktop:
    macUpdatesSigned: false
afterPack: scripts/after-pack.mjs

# Unsigned v1: both switches are single-line reversals once certificates exist.
#
# The single-arch `latest-mac.yml` hazard that used to live here is gone with the
# Intel target: app-builder-lib arch-suffixes the update manifest only on Linux,
# so two mac jobs both wrote `latest-mac.yml` and the released feed named one
# architecture's dmg/zip and never the other's. There is one mac job now, so the
# file it writes describes everything there is. Re-adding an Intel target brings
# the hazard back — and it must be built on a genuinely Intel runner, never
# cross-built, or npm resolves the platform packages against the host and the
# app ships the wrong architecture's koffi, ripgrep and sharp (see the matrix
# comment in .github/workflows/build.yml).
mac:
  # Space-free, see the note under productName. Covers both dmg and zip; they
  # differ by ${ext}, and the zip drops the `-mac` suffix the default carried —
  # nothing reads that suffix, electron-updater takes the name from the feed.
  artifactName: DeepSeek-Harness-${version}-${arch}.${ext}
  target: [dmg, zip]
  category: public.app-category.developer-tools
  identity: null

# zip is omitted on Windows: NSIS + latest.yml is the updater feed there, and
# 7za exhausted hosted-runner memory zipping the ~700MB payload this used to
# be. scripts/prune-payload.mjs removed 112MB and ~20,000 files from the
# harness tree and electronLanguages another 45MB, which is what makes
# compression affordable again — see the `compression` note below.
# Differential packages stay off: they need their own max-compression pass over
# the whole payload, which is the exact 7za failure this is recovering from.
win:
  target: [nsis]
  # signExecutable, NOT signAndEditExecutable: the latter also skips rcedit,
  # which is what writes the icon and version strings into the .exe — leaving
  # the stock Electron icon on the window, the taskbar and Alt+Tab while the
  # NSIS installer (which compiles its own) looked correct. Unsigned v1 wants
  # only the signing half skipped; it is a single-line reversal once a
  # certificate exists.
  signExecutable: false

nsis:
  # Space-free, see the note under productName. This is the one that matters
  # most: NSIS + latest.yml is the whole updater feed on Windows.
  artifactName: DeepSeek-Harness-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false

# `normal` rather than `store` or `maximum`. store (no compression) made the
# installer as large as the payload; maximum is what exhausted 7za's memory on
# a hosted runner. normal is LZMA at a modest dictionary size — most of the
# ratio, a fraction of the peak memory. Revisit maximum only with a CI run to
# prove it, not on the assumption that a smaller payload made it safe.
compression: normal

linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Luna <xxs.main@gmail.com>

# Space-free, see the note under productName. AppImage only, and NOT set on
# `linux:` — that would take the deb with it, and the deb is the one artifact
# whose name was always right: Debian convention builds it from `${name}`,
# which has no space. Renaming it would break the convention to fix nothing.
appImage:
  artifactName: DeepSeek-Harness-${version}-${arch}.${ext}

protocols:
  - name: DeepSeek Harness
    schemes: [dsh-app]

publish:
  - provider: github
    owner: xxsLuna
    repo: deepseek-harness-desktop
    releaseType: draft
