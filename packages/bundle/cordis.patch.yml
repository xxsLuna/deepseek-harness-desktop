# @dsh-desktop/bundle overlay: applied after dsh-base and dsh-web-app.
# Swaps the web transport rows for the socket-path desktop transport while
# every other row (tools, persistence, gateway, the whole ui-* roster) stays
# exactly as the upstream web surface composes it.

# The web transport: a TCP listener, its cmdline flag provider, and the
# URL-printing runtime glue. All replaced below.
- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

# Connection stays UPSTREAM'S, reconfigured rather than disabled — this row is
# the one desktop decision in this file that was got wrong once, so it carries
# the reason.
#
# The physical carrier is all that differs here: the renderer cannot open a
# WebSocket to the app scheme. Since 0.1.2 upstream takes an override for
# exactly that (`globalThis.__DSH_TRANSPORT__`), so there is nothing left to
# replace and `@dsh-desktop/connection` installs the override instead.
#
# Disabling this row and standing in for it — which is what shipped as
# `0.1.5-desktop-alpha0.1.0` — cannot work, and fails silently in the build.
# Upstream's client bundles are module-host factories, so a stand-in that
# re-exports one compiles to a runtime require against the browser module
# table, and `dsh-client-modules` builds that table only from MOUNTED rows.
# Turning this row off removed the module the stand-in required, every client
# plugin failed behind it, and the app opened to "Failed to load plugins".
- id: connection
  # `inject` and `config` are BOTH overridden, and neither is optional.
  # Upstream's row reads `inject: [webRuntime]` with
  # `trustedHosts: !!js ctx.webRuntime.trustedHosts`, and `web-runtime` is a row
  # this app disables — so left alone the row waits forever on a service nothing
  # provides, and its config expression has no `ctx.webRuntime` to read.
  # An empty trust list is the honest value here: the only surface is the
  # launcher's own socket, and there is no LAN bind to derive authorities from.
  inject: []
  config:
    trustedHosts: []

# The HMR browser half opens EventSource('/plugins/events'), which the app
# scheme cannot serve; a failed client fiber would hold the whole UI on the
# loading page. Desktop applies plugin changes on restart.
- id: client-hmr
  disabled: true

# The auto-chooser would pick the -native backend, whose OS chooser is spawned
# by the harness process. That assumes the harness is the foreground GUI app;
# here it is a background sidecar, so the dialog opens but can never come
# forward. Our provider delegates the pick to the launcher's own dialog.
- id: directory-picker
  disabled: true

- insert:
    # The socket-path carrier: provides `webServer` with no TCP port. The
    # launcher (Electron main) supplies the socket path and bearer token.
    - id: desktop-carrier
      name: '@dsh-desktop/carrier'
      config:
        socketPath: !!js process.env.DSH_DESKTOP_SOCKET
        token: !!js process.env.DSH_DESKTOP_TOKEN

    # Desktop surface glue: dist fallback owner, SSE event routes, and the
    # desktop-surface prompt section + DSH_SURFACE shell variable.
    - id: desktop-runtime
      name: '@dsh-desktop/bundle'

    # The merged title band, injected into the served document. Its own row
    # rather than part of desktop-runtime: it is window chrome, not transport,
    # and a platform that kept its native title bar composes it with a zero
    # height and it injects nothing. Every number is the launcher's — it is the
    # process that hid the title bar, and on Windows it sizes the
    # window-controls overlay from the same values.
    - id: desktop-chrome
      name: '@dsh-desktop/chrome'
      config:
        height: !!js Number(process.env.DSH_DESKTOP_BAND_HEIGHT ?? 0)
        lead: !!js Number(process.env.DSH_DESKTOP_BAND_LEAD ?? 0)
        menuButton: !!js process.env.DSH_DESKTOP_BAND_MENU === '1'

    # The carrier override for the `connection` row above: a node-only row that
    # injects `globalThis.__DSH_TRANSPORT__` at the top of the served `<head>`,
    # where it precedes every boot row upstream injects. Carries no config —
    # the connection options belong to upstream's row, which is the row that
    # reads them.
    #
    # An injection rather than a client plugin ON PURPOSE. Upstream asks for
    # the global "before plugin boot", and a document position settles that;
    # a client row would have to win an ordering argument instead, and would
    # have to be in the browser module table to do it.
    - id: desktop-connection
      name: '@dsh-desktop/connection'

    # Desktop Settings: one settings section for the preferences only the
    # launcher can act on (tray, close behaviour, notifications, title bar,
    # auto-update). The row carries no config — the launcher owns the values
    # and the browser half reads them from it directly, because none of them
    # is a harness fact.
    - id: desktop-settings
      name: '@dsh-desktop/settings'

    # Exposes Claude-format plugins already on disk as harness skills. Its own
    # row rather than part of desktop-market because it stands alone: a plugin
    # copied in by hand works exactly as well as one the marketplace installed,
    # and the marketplace is useful without it. The two share a directory
    # layout, not an import.
    - id: desktop-claude-plugins
      name: '@dsh-desktop/claude-plugins'

    # The plugin marketplace: the installer's routes, the trusted-source
    # settings namespace, and the Marketplace tab in Plugins settings. Carries
    # no config — the default catalog is seeded through the settings `base`
    # layer so a user can remove it, which is the difference between a
    # marketplace that is registered and one that is baked in.
    - id: desktop-market
      name: '@dsh-desktop/market'

    # Remembers whether the sidebar was collapsed. Its own row rather than part
    # of desktop-chrome: that one owns the title band the LAUNCHER freed, and
    # this owns a page-layout preference upstream simply does not persist —
    # different concern, and the band's config is the launcher's while this
    # plugin carries none.
    - id: desktop-layout-memory
      name: '@dsh-desktop/layout-memory'

    # directoryPicker with the `native` interaction, delegated over the carrier
    # socket to the launcher's window-owned Electron dialog. Replaces the
    # disabled auto-chooser row above.
    - id: desktop-picker
      name: '@dsh-desktop/picker'

    # The auto-chooser used to mount the matching client surface itself; with
    # it disabled the surface row is composed explicitly.
    - id: ui-directory-picker
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
