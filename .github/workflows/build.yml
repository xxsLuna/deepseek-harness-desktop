# Five-target build + packaged smoke. Reused by pull requests (publish: false)
# and by release.yml (publish: true → assets attach to a draft GitHub Release,
# which is also the electron-updater feed).
name: build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-latest
            builder: --mac --arm64
          # Cross-built on Apple Silicon: the macos-13 Intel runners are being
          # retired and their queue no longer clears. The payload is a stock
          # Node binary plus stock prebuilds, both fetched per target arch, so
          # nothing here is compiled against the host.
          - target: mac-x64
            runner: macos-latest
            builder: --mac --x64
            nodeArch: x64
            cross: true
          - target: win-x64
            runner: windows-latest
            builder: --win --x64
          - target: linux-x64
            runner: ubuntu-24.04
            builder: --linux --x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            builder: --linux --arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Stage harness
        run: npm run stage

      - name: Fetch bundled Node
        run: npm run fetch-node -- --arch ${{ matrix.nodeArch || runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Build
        run: npm run build

      # Before the tests on a native build: the contract suite then boots the
      # same pruned tree the installer ships, so a rule that deletes something
      # load-bearing fails here rather than on a user's machine.
      - name: Prune payload
        if: ${{ !matrix.cross }}
        run: npm run prune -- --platform ${{ startsWith(matrix.target, 'win') && 'win32' || startsWith(matrix.target, 'mac') && 'darwin' || 'linux' }} --arch ${{ matrix.nodeArch || runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Unit tests
        run: npm test

      - name: Contract tests
        run: npm run test:contract

      # A cross build prunes AFTER the suite instead. Pruning targets the build's
      # arch, which on a cross build is not the runner's, so the host's own
      # prebuilds are gone by design — node-pty then fails to load and takes the
      # sidecar boot and the PTY probe with it. Nothing is lost by testing the
      # full tree here: this runner could only ever have exercised its own arch,
      # which is exactly what the mac-arm64 job already does. The target's arch
      # is verified by verify-payload below, and by mac-arm64 running this same
      # rule natively.
      - name: Prune payload (cross build)
        if: ${{ matrix.cross }}
        run: npm run prune -- --platform ${{ startsWith(matrix.target, 'win') && 'win32' || startsWith(matrix.target, 'mac') && 'darwin' || 'linux' }} --arch ${{ matrix.nodeArch || runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Package
        env:
          GH_TOKEN: ${{ inputs.publish && secrets.GITHUB_TOKEN || '' }}
        run: npx electron-builder ${{ matrix.builder }} --publish ${{ inputs.publish && 'always' || 'never' }}

      - name: Verify payload (macOS)
        if: startsWith(matrix.target, 'mac')
        # Glob the bundle rather than naming it: a productName change must not
        # silently turn this gate into a no-op.
        run: node scripts/verify-payload.mjs "$(ls -d out/mac*/*.app | head -1)/Contents/Resources"

      - name: Verify payload (Windows)
        if: startsWith(matrix.target, 'win')
        run: node scripts/verify-payload.mjs out/win-unpacked/resources

      - name: Verify payload (Linux)
        if: startsWith(matrix.target, 'linux')
        run: node scripts/verify-payload.mjs "$(ls -d out/linux*-unpacked | head -1)/resources"

      # ELECTRON_DISABLE_SANDBOX: hosted ubuntu-24.04 restricts unprivileged
      # user namespaces and the unpacked build's chrome-sandbox lacks SUID, so
      # Chromium cannot sandbox here. A deliberate CI-only fidelity reduction;
      # local smokes and real installs keep the sandbox.
      - name: Packaged smoke (Linux)
        if: startsWith(matrix.target, 'linux')
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run -a node scripts/smoke-packaged.mjs

      - name: Packaged smoke (Windows)
        if: startsWith(matrix.target, 'win')
        run: node scripts/smoke-packaged.mjs

      # Promoted to a required gate: an unsigned .app does launch and render on
      # a hosted runner (proven on mac-arm64), so a regression here is real.
      # A cross-built app cannot run on this host, so only the payload is
      # verified there — its own arch runs it at release time.
      - name: Packaged smoke (macOS)
        if: startsWith(matrix.target, 'mac') && !matrix.cross
        run: node scripts/smoke-packaged.mjs

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: |
            out/*.dmg
            out/*.zip
            out/*.exe
            out/*.AppImage
            out/*.deb
            out/latest*.yml
          if-no-files-found: warn

  # The one required status check on main.
  #
  # The matrix jobs cannot be required directly: their check names embed every
  # matrix value ("build (mac-x64, macos-latest, --mac --x64, x64, true)"), so
  # editing an entry renames the check, and a required check that no longer
  # exists blocks every pull request forever. This name never changes.
  #
  # `always()` plus an explicit result test is required: without it a skipped or
  # cancelled matrix would skip this job too, and a skipped required check
  # counts as passing.
  all-targets-built:
    if: always()
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every target built
        run: |
          echo "build matrix result: ${{ needs.build.result }}"
          test "${{ needs.build.result }}" = "success"
