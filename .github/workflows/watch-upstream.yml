# Daily upstream watch: when @deepseek-ai/dsh publishes a new version, open a
# PR bumping harness.json and package.json. The PR's build workflow re-runs
# the contract suite and five-target packaging, so a green PR is releasable.
name: watch-upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      # Branch the bump off dev and open the pull request against it: every
      # change reaches main the same way, and a bump cut from main would carry
      # an unrelated diff once dev is ahead.
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Compare pinned and published versions
        id: versions
        run: |
          PINNED=$(node -p "require('./harness.json').harness")
          LATEST=$(npm view @deepseek-ai/dsh version)
          # Ahead, not merely different. The pin can legitimately sit ABOVE the
          # `latest` tag — upstream publishes to `next` first, and a release cut
          # from a `next` version leaves the pin ahead until `latest` catches up.
          # Gating on inequality made the watch open a PR walking that pin back
          # down, every day, until it was closed by hand.
          AHEAD=$(node -e "
            const parts = (v) => {
              const [core, pre = ''] = v.replace(/^v/, '').split(/-(.*)/s)
              return { core: core.split('.').map(Number), pre: pre === '' ? [] : pre.split('.') }
            }
            const a = parts(process.argv[1]), b = parts(process.argv[2])
            let ahead = null
            for (let i = 0; i < 3; i += 1) if (a.core[i] !== b.core[i]) { ahead = a.core[i] > b.core[i]; break }
            if (ahead === null) {
              if (a.pre.length === 0 || b.pre.length === 0) ahead = b.pre.length > 0
              else for (let i = 0; ahead === null; i += 1) {
                const l = a.pre[i], r = b.pre[i]
                if (l === undefined && r === undefined) { ahead = false; break }
                if (l === undefined) { ahead = false; break }
                if (r === undefined) { ahead = true; break }
                if (l === r) continue
                const ln = /^\d+\$/.test(l), rn = /^\d+\$/.test(r)
                ahead = ln !== rn ? rn : ln ? Number(l) > Number(r) : l > r
              }
            }
            console.log(ahead ? 'yes' : 'no')
          " "$LATEST" "$PINNED")
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "pinned $PINNED / latest $LATEST / latest ahead of pin: $AHEAD"

      - name: Open bump PR
        if: steps.versions.outputs.ahead == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.versions.outputs.latest }}
          PR_BODY: |
            `package.json` carries the release version `scripts/release-version.mjs` derives from the pin — upstream's core and rc number, with the scheme number carried across unchanged. That number is electron-updater's channel, so moving it strands the installed base for a release and stays a migration someone announces by hand. The new version is recorded in `PUBLISHED` as well, so the next bump is compared against it.

            The build workflow on this PR re-runs the sidecar contract suite and five-target packaging against the new version. Green checks mean the coupling contracts held; a red check names the exact seam that changed.
        run: |
          BRANCH="upstream-bump/$LATEST"
          if git ls-remote --exit-code origin "refs/heads/$BRANCH" >/dev/null 2>&1; then
            echo "bump branch already exists"; exit 0
          fi
          git config user.name "Luna"
          git config user.email "xxs.main@gmail.com"
          git switch -c "$BRANCH"
          # Writes all three files the cut touches. This used to write upstream's
          # bare version into package.json, which the scheme rejects — so the PR
          # arrived red on version-scheme.spec.ts every time and waited on the
          # same two hand edits before its checks said anything about the
          # harness. Deriving instead needs no dependency, which is why there is
          # no install step above. stdout is the release version, nothing else.
          RELEASE=$(node scripts/release-version.mjs "$LATEST")
          git add harness.json package.json tests/unit/version-scheme.spec.ts
          git commit -m "Track upstream @deepseek-ai/dsh $LATEST"
          git push -u origin "$BRANCH"
          gh label create upstream-bump --color 0E8A16 --description "Automated harness version bump" 2>/dev/null || true
          # Built as a file so the body can keep its backticks without fighting
          # shell quoting for them.
          {
            printf 'Automated bump: pinned `%s`, shipping as `%s`.\n\n' "$LATEST" "$RELEASE"
            printf '%s\n' "$PR_BODY"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --base dev \
            --title "Track upstream @deepseek-ai/dsh $LATEST" \
            --label upstream-bump \
            --body-file "$RUNNER_TEMP/pr-body.md"
